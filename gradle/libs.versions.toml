# 版本说明:全部来自 2026-09-14 实地查询,不要凭记忆改动。
# AGP 9.x 默认内置 Kotlin(不再应用 org.jetbrains.kotlin.android 插件)。
# AGP 9.4 要求 Gradle >= 9.6.0(官方兼容表)。
[versions]
agp = "9.4.0"
coreKtx = "1.19.0"
appcompat = "1.8.0"
material = "1.14.0"
osmdroid = "6.1.20"   # Phase 2 启用;osmdroid 项目已归档,6.1.20 为最终版
junit = "4.13.2"
orgJson = "20260814"  # JVM 单测用真实 org.json(Android 平台 jar 里是抛异常的桩实现)
amap3d = "10.0.600"   # Phase 2 启用;maven central 上的最新 release(2026-09 核实)
amapSearch = "9.7.0"  # POI 搜索;必须与 3dmap 10.0.600 配对(9.7.1 有 utils-core 重复类冲突)

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
osmdroid-android = { group = "org.osmdroid", name = "osmdroid-android", version.ref = "osmdroid" }
# 注意:访问器不能以数字开头,所以叫 amap-map 而不是 amap-3dmap
amap-map = { group = "com.amap.api", name = "3dmap", version.ref = "amap3d" }
amap-search = { group = "com.amap.api", name = "search", version.ref = "amapSearch" }
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
